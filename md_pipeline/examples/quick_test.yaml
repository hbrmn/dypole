# Tiny, fast version of the series to check that the whole pipeline works
# (minutes on a laptop). The numbers are NOT converged -- only for testing.
project: {name: quick_test, output_dir: ../runs_quick_test, seed: 1}
compositions:
  series:
    name: "LS_x{x:.2f}"
    label: "x in xLi2O-(1-x)SiO2"
    values: [0.20, 0.33]
    oxides: {Li2O: "x", SiO2: "1 - x"}
    density: [[0.0, 2.20], [0.33, 2.35]]
system: {target_atoms: 600, min_distance: 1.6, replicas: 1}
potential: ../potentials/pedone.yaml
lammps: {command: lmp, mpi_ranks: 1, run_mode: local}
simulation:
  timestep_fs: 1.0
  thermo_every: 500
  stages:
    - {type: minimize}
    - {type: relax, T: 300, time_ps: 1}
    - {type: equilibrate, T: 4000, time_ps: 5, ensemble: nvt, name: melt}
    - {type: ramp, T_start: 4000, T_end: 2000, rate_K_per_ps: 500, ensemble: nvt, name: quench_nvt}
    - {type: ramp, T_start: 2000, T_end: 300, rate_K_per_ps: 500, ensemble: npt, P_bar: 0, name: quench_npt}
    - {type: equilibrate, T: 300, time_ps: 2, ensemble: npt, P_bar: 0}
    - {type: production, T: 300, time_ps: 5, ensemble: nvt, dump_every_ps: 0.1}
analysis:
  r_max: 7.0
  dr: 0.02
  coordination: {pairs: [Si-O, Li-O, O-Si]}
  qn: {formers: [Si]}
  bond_angles: [O-Si-O, Si-O-Si]
  nmr_m2:
    - {observe: 7Li, partner: 7Li}
    - {observe: 29Si, partner: 7Li}
  isotope_table: ../../IsotopeProperties
